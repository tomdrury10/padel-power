<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Padel Power</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/styles.css?v=30">
</head>
<body class="lg-body">

<main class="lg-wrap">
  <div class="lg-card">
    <a class="lg-logo" href="../" aria-label="Padel Power home">
      <img src="../assets/logo.png" alt="Padel Power">
    </a>
    <span class="lg-eyebrow">Studio Manager</span>
    <h1>Admin login</h1>

    <form id="lgForm">
      <label class="lg-label" for="lgEmail">Email</label>
      <input class="lg-input" id="lgEmail" name="lgEmail" type="email" autocomplete="username" placeholder="you@padelpower.uk" required>
      <label class="lg-label" for="lgPass">Password</label>
      <input class="lg-input" id="lgPass" name="lgPass" type="password" autocomplete="current-password" placeholder="Your password" required>
      <div class="lg-error" id="lgError" hidden></div>
      <button class="lg-btn" id="lgBtn" type="submit">Sign in <span class="arr">→</span></button>
    </form>
  </div>
  <a class="lg-back" href="../">← Back to the website</a>
</main>

<script src="../assets/pilates-core.js?v=17"></script>
<script>
(() => {
  const next = new URLSearchParams(location.search).get('next') || '../admin/';
  const form = document.getElementById('lgForm');
  const err = document.getElementById('lgError');
  const btn = document.getElementById('lgBtn');

  // already signed in? go straight through
  if (Auth.token()) location.replace(next);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
      await Auth.signIn(form.lgEmail.value.trim(), form.lgPass.value);
      location.replace(next);
    } catch (ex) {
      err.textContent = /invalid/i.test(ex.message) ? 'That email and password combination was not recognised.' : ex.message;
      err.hidden = false;
      btn.disabled = false;
      btn.innerHTML = 'Sign in <span class="arr">→</span>';
      form.lgPass.value = '';
      form.lgPass.focus();
    }
  });
})();
</script>
</body>
</html>
